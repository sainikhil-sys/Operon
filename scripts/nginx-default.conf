# ==============================================================================
# Nginx Virtual Host Configuration — Operon & CogniQA Systems
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CogniQA Systems Corporate Parent Site (cogniqa.systems & IP fallback)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name cogniqa.systems www.cogniqa.systems 20.244.7.58 _;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        root /var/www/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl default_server;
    server_name cogniqa.systems www.cogniqa.systems 20.244.7.58;

    ssl_certificate /etc/letsencrypt/live/cogniqa.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cogniqa.systems/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        root /var/www/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }
}

# ------------------------------------------------------------------------------
# 2. Operon Application (operon.cogniqa.systems) -> Next.js PM2 Port 3000
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name operon.cogniqa.systems;

    client_max_body_size 500M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    server_name operon.cogniqa.systems;

    ssl_certificate /etc/letsencrypt/live/cogniqa.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cogniqa.systems/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
